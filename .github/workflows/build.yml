name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build, test, lint
        id: gradle
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease assembleDebug 2>&1 | tee build.log
      - name: Collect outputs
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ || true
          cp app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk out/ 2>/dev/null || true
          (cd app/build/test-results && zip -qr ../../../out/test-results.zip .) 2>/dev/null || true
          echo "status=${{ steps.gradle.outcome }}" > out/status.txt
          ls -la out
      - name: Publish release assets
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ci-${GITHUB_SHA::7}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" out/* --prerelease --title "CI build $TAG" --notes "Automated build for ${GITHUB_SHA}"
