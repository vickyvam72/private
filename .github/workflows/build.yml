name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        continue-on-error: true
        with:
          distribution: temurin
          java-version: '17'
      - name: Build, test, lint
        id: gradle
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "== env"; java -version 2>&1; echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms" 2>&1
            SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
            echo "sdkmanager=$SDKM"
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -3 || true
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease assembleDebug
          } 2>&1 | tee build.log
      - name: Probe IDX stock summary endpoint
        if: always()
        continue-on-error: true
        run: |
          UA='Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Mobile Safari/537.36'
          curl -sS -c jar.txt -A "$UA" -o /dev/null -w "home %{http_code}\n" https://www.idx.co.id/id > idx-probe.txt 2>&1 || true
          for d in $(for i in 1 2 3 4 5 6; do date -d "-$i day" +%Y%m%d; done); do
            curl -sS -b jar.txt -A "$UA" -H 'X-Requested-With: XMLHttpRequest' -H 'Referer: https://www.idx.co.id/id/data-pasar/ringkasan-perdagangan/ringkasan-saham/' \
              -o day.json -w "$d %{http_code} %{size_download}\n" "https://www.idx.co.id/primary/TradingSummary/GetStockSummary?length=9999&start=0&date=$d" >> idx-probe.txt 2>&1 || true
            head -c 700 day.json >> idx-probe.txt; echo >> idx-probe.txt
          done
      - name: Collect outputs
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ || echo "no build.log" > out/build.log
          cp idx-probe.txt out/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk out/ 2>/dev/null || true
          (cd app/build/test-results && zip -qr ../../../out/test-results.zip .) 2>/dev/null || true
          echo "status=${{ steps.gradle.outcome }}" > out/status.txt
          ls -la out
      - name: Publish release assets
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ci-${GITHUB_SHA::7}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" out/* --prerelease --title "CI build $TAG" --notes "Automated build for ${GITHUB_SHA}"
